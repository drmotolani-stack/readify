
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readify</title>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.worker.mjs";

const $ = id => document.getElementById(id);
let voices = [], sentences = [], index = 0, playing = false, paused = false, pdf = null, timer = null;

function status(s) { $("status").textContent = s; }

function getEnglishVoices() {
  voices = speechSynthesis.getVoices().filter(v => /^en(-|$)/i.test(v.lang));
  const sel = $("voice");
  const old = sel.value;
  sel.innerHTML = "";
  voices.forEach((v,i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  if (voices[old]) sel.value = old;
}
speechSynthesis.onvoiceschanged = getEnglishVoices;
getEnglishVoices();

function cleanLine(line) {
  return line
    .replace(/\s+/g, " ")
    .replace(/https?:\/\/\S+/gi, "")
    .replace(/\bwww\.\S+/gi, "")
    .replace(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/gi, "")
    .trim();
}

function isNoise(line) {
  if (!line) return true;
  if (/^\d{1,4}$/.test(line)) return true;
  if (/^(page\s*)?\d{1,4}\s*(of\s*\d{1,4})?$/i.test(line)) return true;
  if (/https?:\/\/|www\.|@[\w.-]+\.[a-z]{2,}/i.test(line)) return true;
  if (/^(copyright|all rights reserved|isbn)\b/i.test(line)) return true;
  return false;
}

function isHeading(line) {
  if (line.length > 100) return false;
  if (/^(chapter|part|section|introduction|conclusion|preface|contents|appendix)\b/i.test(line)) return true;
  if (line.length < 65 && line === line.toUpperCase() && /[A-Z]/.test(line)) return true;
  if (line.length < 65 && !/[.!?]$/.test(line) && line.split(" ").length <= 8) return true;
  return false;
}

function prepareText(pages) {
  const allLines = pages.flatMap(p => p.split("\n").map(cleanLine));
  const counts = {};
  allLines.forEach(line => {
    if (line.length > 3) counts[line.toLowerCase()] = (counts[line.toLowerCase()] || 0) + 1;
  });

  const repeated = new Set(
    Object.keys(counts).filter(k => counts[k] >= Math.max(3, Math.ceil(pages.length * 0.25)))
  );

  const output = [];
  pages.forEach((page, i) => {
    const lines = page.split("\n").map(cleanLine);
    const cleaned = lines.filter(line =>
      !isNoise(line) && !repeated.has(line.toLowerCase())
    );

    output.push({ heading: `Page ${i+1}`, text: cleaned.join(" ") });
  });

  let text = output.map(p => p.text).join("\n\n");
  text = text.replace(/\s+/g, " ").trim();

  // Remove repeated title-like phrases at the start when possible.
  text = text.replace(/\b(Introduction)\s+\1\b/gi, "$1");

  return text;
}

function splitSentences(text) {
  return text.match(/[^.!?]+[.!?]+(?:["')\]]*)|[^.!?]+$/g)
    ?.map(s => s.trim()).filter(Boolean) || [];
}

function renderCaptions() {
  const current = sentences[index] || "";
  const next = sentences.slice(index+1, index+3).join(" ");
  $("captionCurrent").textContent = current;
  $("captionNext").textContent = next;
  $("position").textContent = `Sentence ${index+1} of ${sentences.length}`;
  $("progress").value = sentences.length ? (index / sentences.length) * 100 : 0;
}

function speak() {
  if (!playing || index >= sentences.length) {
    playing = false;
    status("Finished reading.");
    return;
  }

  renderCaptions();
  const u = new SpeechSynthesisUtterance(sentences[index]);
  u.rate = Number($("speed").value);
  u.voice = voices[Number($("voice").value)] || null;

  u.onend = () => {
    if (playing && !paused) {
      index++;
      renderCaptions();
      speak();
    }
  };

  u.onerror = e => {
    if (e.error !== "canceled" && e.error !== "interrupted") {
      status("Speech error. Try another voice.");
    }
  };

  speechSynthesis.speak(u);
}

function play() {
  if (!sentences.length) return;
  if (paused) {
    paused = false;
    playing = true;
    speechSynthesis.resume();
    status("Reading...");
    return;
  }
  if (playing) return;
  if (index >= sentences.length) index = 0;
  playing = true;
  status("Reading...");
  speak();
}

function pause() {
  paused = true;
  playing = false;
  speechSynthesis.pause();
  status("Paused.");
}

function stop() {
  playing = false;
  paused = false;
  speechSynthesis.cancel();
  index = 0;
  renderCaptions();
  status("Stopped.");
}

function jump(n) {
  speechSynthesis.cancel();
  index = Math.max(0, Math.min(sentences.length-1, index+n));
  paused = false;
  playing = true;
  speak();
}

$("upload").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  stop();
  status("Reading PDF...");
  $("preview").innerHTML = "";
  try {
    pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    let pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      pages.push(content.items.map(i => i.str).join(" "));
      status(`Extracting page ${p} of ${pdf.numPages}`);
    }

    const text = prepareText(pages);
    sentences = splitSentences(text);
    index = 0;
    $("preview").textContent = text;
    $("filename").textContent = file.name;
    $("reader").hidden = false;
    renderCaptions();
    status("Document ready.");
  } catch (err) {
    console.error(err);
    status("Unable to read this PDF.");
  }
});

$("play").onclick = play;
$("pause").onclick = pause;
$("stop").onclick = stop;
$("back").onclick = () => jump(-5);
$("forward").onclick = () => jump(5);

$("speed").onchange = () => {
  if (playing) {
    speechSynthesis.cancel();
    speak();
  }
};
$("voice").onchange = () => {
  if (playing) {
    speechSynthesis.cancel();
    speak();
  }
};
</script>

<style>
* {box-sizing:border-box}
body {
  background:#101827;color:#f1f5f9;font-family:Arial,sans-serif;
  margin:0;padding:20px;
}
main {max-width:800px;margin:25px auto}
.panel {background:#1e293b;padding:20px;border-radius:14px;margin:16px 0}
h1 {font-size:30px}
label {display:block;margin-top:15px}
button,select,input {
  border-radius:8px;padding:12px;font-size:15px;
}
button {background:#334155;color:white;border:0;cursor:pointer;margin:4px}
button.primary {background:#2563eb}
select {background:#334155;color:white;width:100%;margin-top:8px}
.controls {display:flex;flex-wrap:wrap;justify-content:center;margin:18px 0}
#status {color:#93c5fd}
progress {width:100%;height:12px}
#captionCurrent {
  font-size:23px;line-height:1.6;color:white;font-weight:bold;
}
#captionNext {font-size:18px;line-height:1.6;color:#94a3b8}
#preview {max-height:250px;overflow:auto;white-space:pre-wrap;line-height:1.6}
[hidden] {display:none!important}
@media(max-width:500px) {
  body {padding:10px}
  main {margin:10px auto}
  .panel {padding:16px}
  #captionCurrent {font-size:20px}
}
</style>
</head>
<body>
<main>
<h1>📖 Readify</h1>
<p>Listen. Follow. Learn.</p>

<div class="panel">
<h3>Upload a PDF</h3>
<input type="file" id="upload" accept=".pdf,application/pdf">
<p id="status">Ready.</p>
</div>

<div class="panel" id="reader" hidden>
<h3 id="filename"></h3>

<div class="panel" style="background:#0f172a">
<p id="position"></p>
<div id="captionCurrent"></div>
<div id="captionNext"></div>
</div>

<div class="controls">
<button id="back">⏪ Back</button>
<button id="play" class="primary">▶ Play</button>
<button id="pause">⏸ Pause</button>
<button id="stop">⏹ Stop</button>
<button id="forward">⏩ Forward</button>
</div>

<label>Playback speed</label>
<select id="speed">
<option value="0.75">0.75×</option>
<option value="1">1×</option>
<option value="1.25">1.25×</option>
<option value="1.5">1.5×</option>
<option value="1.75">1.75×</option>
<option value="2">2×</option>
</select>

<label>English voices only</label>
<select id="voice"></select>

<label>Progress</label>
<progress id="progress" value="0" max="100"></progress>
</div>

<div class="panel">
<h3>Cleaned text</h3>
<div id="preview">Your text will appear here.</div>
</div>
</main>
</body>
</html>
